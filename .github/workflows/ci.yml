name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - '**/*.ico'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Provision completion shells
        run: sudo apt-get update && sudo apt-get install --yes zsh fish

      - name: Check formatting
        run: mise run fmt:check

      - name: Run linters
        run: mise run lint

      - name: Run vet
        run: mise run vet

      - name: Run tests
        run: mise run test

      - name: Run vulnerability checks
        run: mise run vuln

      - name: Build CLI
        run: mise run build

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6

      - name: Evaluate Nix flake
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Build Nix package
        run: nix build --no-link --no-update-lock-file --print-build-logs

  completion-bash3:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify stock macOS Bash 3.2 completion
        run: |
          /bin/bash --version | head -1 | grep 'version 3.2'
          go test ./cmd/seshagy -run 'TestGeneratedBashWorksStandaloneAndDoesNotExecuteInput|TestGeneratedShellSyntax/bash' -count=1

  release:
    needs: [verify, completion-bash3]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
